<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
  <!-- Ground foundation & plaza base -->
  <line x1="8" y1="58" x2="56" y2="58" />
  <rect x="12" y="54" width="40" height="4" rx="0.5" />

  <!-- LEFT PETRONAS TOWER -->
  <!-- Tower Base to Lower Tier (x: 17 to 27) -->
  <path d="M17 54 V46 H27 V54" />
  <!-- Tier 2 -->
  <path d="M18 46 V38 H26 V46" />
  <!-- Tier 3 -->
  <path d="M19 38 V30 H25 V38" />
  <!-- Tier 4 -->
  <path d="M20 30 V22 H24 V30" />
  <!-- Tier 5 (Tapering Pinnacle Top) -->
  <path d="M21 22 V16 H23 V22" />
  <!-- Left Soaring Needle Spire -->
  <line x1="22" y1="16" x2="22" y2="6" stroke-width="2" />
  <circle cx="22" cy="5" r="1" fill="currentColor" />

  <!-- RIGHT PETRONAS TOWER -->
  <!-- Tower Base to Lower Tier (x: 37 to 47) -->
  <path d="M37 54 V46 H47 V54" />
  <!-- Tier 2 -->
  <path d="M38 46 V38 H46 V46" />
  <!-- Tier 3 -->
  <path d="M39 38 V30 H45 V38" />
  <!-- Tier 4 -->
  <path d="M40 30 V22 H44 V30" />
  <!-- Tier 5 (Tapering Pinnacle Top) -->
  <path d="M41 22 V16 H43 V22" />
  <!-- Right Soaring Needle Spire -->
  <line x1="42" y1="16" x2="42" y2="6" stroke-width="2" />
  <circle cx="42" cy="5" r="1" fill="currentColor" />

  <!-- FAMOUS DOUBLE-DECK SKYBRIDGE CONNECTING BOTH TOWERS -->
  <!-- Upper & Lower decks of bridge (Level 41 & 42) -->
  <rect x="25" y="32" width="14" height="4" rx="0.5" fill="currentColor" fill-opacity="0.15" />
  <!-- Angled V-shaped diagonal support struts beneath skybridge -->
  <line x1="26" y1="36" x2="32" y2="44" stroke-width="1.5" />
  <line x1="38" y1="36" x2="32" y2="44" stroke-width="1.5" />

  <!-- Architectural Facade Grid Lines (Glass and Stainless Steel panels) -->
  <line x1="22" y1="46" x2="22" y2="54" stroke-width="1" />
  <line x1="22" y1="38" x2="22" y2="46" stroke-width="1" />
  <line x1="42" y1="46" x2="42" y2="54" stroke-width="1" />
  <line x1="42" y1="38" x2="42" y2="46" stroke-width="1" />
</svg>