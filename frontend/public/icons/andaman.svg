<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
  <!-- Ocean waves surface -->
  <line x1="4" y1="58" x2="60" y2="58" />
  <path d="M4 54 C10 52 16 54 22 52 C28 50 34 52 40 50 C46 48 52 50 58 48" stroke-width="1.5" />

  <!-- Tropical Island Coconut Palm Tree (Left) -->
  <path d="M12 56 C14 44 12 34 18 24" stroke-width="2.5" />
  <path d="M10 56 C12 44 10 34 16 24" stroke-width="1.5" />
  <!-- Palm Fronds -->
  <path d="M17 24 C10 19 6 22 4 28" />
  <path d="M17 24 C12 15 7 15 4 19" />
  <path d="M17 24 C19 14 25 12 29 16" />
  <path d="M17 24 C24 18 28 24 28 30" />
  <circle cx="16" cy="25.5" r="1.5" fill="currentColor" />

  <!-- Rocky Promontory Cape Foundation (Right) -->
  <path d="M36 56 C38 50 42 46 48 46 C54 46 58 50 60 56" />

  <!-- Historic Andaman Island Lighthouse (Center Right) -->
  <!-- Tapered Tower Walls -->
  <path d="M42 46 L44 24 H52 L54 46 Z" />
  <!-- Spiral / Striped Architectural Bands across lighthouse -->
  <line x1="43" y1="40" x2="53" y2="40" stroke-width="1.5" />
