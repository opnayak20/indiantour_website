  <!-- Lighthouse Lantern Gallery & Balcony Railing -->
  <rect x="42" y="22" width="12" height="3" rx="0.5" />
  <line x1="43" y1="20" x2="53" y2="20" stroke-width="1.5" />

  <!-- Glass Light Chamber -->
  <rect x="44.5" y="16" width="7" height="6" />

  <!-- Lighthouse Domed Cupola Roof & Finial -->
  <path d="M43.5 16 C43.5 12 52.5 12 52.5 16 Z" />
  <line x1="48" y1="12" x2="48" y2="9" stroke-width="1.5" />
  <circle cx="48" cy="8" r="1" fill="currentColor" />

  <!-- Radiating Light Beams -->
  <line x1="42" y1="18" x2="32" y2="15" stroke-dasharray="2 2" stroke-width="1.5" />
  <line x1="41" y1="20" x2="30" y2="22" stroke-dasharray="2 2" stroke-width="1.5" />

  <!-- Leaping Dolphin / Coral Reef Sea Life Accent (Left Center) -->
  <path d="M24 46 C27 41 33 42 34 46" stroke-width="1.5" />
  <path d="M33 43 L36 41" stroke-width="1.5" />
