<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
  <!-- Ground terrace base -->
  <line x1="8" y1="58" x2="56" y2="58" />
  <rect x="12" y="52" width="40" height="6" rx="1" />
  <rect x="16" y="47" width="32" height="5" rx="1" />

  <!-- Stupa Hemispherical Dome (Bumpa) -->
  <path d="M18 47 C18 34 46 34 46 47 Z" />
  
  <!-- Sacred Buddha arched niche inside dome -->
  <path d="M29 47 V42 C29 40 35 40 35 42 V47" />

  <!-- Harmika (Square architectural tier above dome) -->
  <rect x="27" y="27" width="10" height="6" rx="0.5" />
  <line x1="27" y1="30" x2="37" y2="30" />

  <!-- Tapered Spire Rings (13 Bhumi rings) -->
  <line x1="28" y1="24" x2="36" y2="24" />
  <line x1="29" y1="21" x2="35" y2="21" />
  <line x1="30" y1="18" x2="34" y2="18" />
  <line x1="30.5" y1="15" x2="33.5" y2="15" />
  <line x1="32" y1="27" x2="32" y2="12" />

  <!-- Apex Finial (Crescent Moon and Sun / Parasol) -->
  <path d="M29 12 C29 10 35 10 35 12 Z" />
  <circle cx="32" cy="7" r="1.5" fill="currentColor" />

  <!-- Mountain peak contours in background -->
  <path d="M4 52 L12 40 L19 46" stroke-dasharray="0" />
  <path d="M45 46 L53 38 L60 52" stroke-dasharray="0" />

  <!-- Prayer flag bunting subtle line -->
  <path d="M12 40 Q20 36 27 29" stroke-width="1.5" stroke-dasharray="2 2" />
  <path d="M37 29 Q44 35 53 38" stroke-width="1.5" stroke-dasharray="2 2" />
</svg>
