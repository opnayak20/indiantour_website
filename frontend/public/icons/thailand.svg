<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
  <!-- Ground terrace base -->
  <line x1="8" y1="58" x2="56" y2="58" />
  <rect x="12" y="52" width="40" height="6" rx="1" />
  
  <!-- Stepped Thai Temple Foundation Plinth -->
  <path d="M16 52 L19 45 H45 L48 52 Z" />

  <!-- Lower Roof Tier with Upturned Thai Chofah Horn Finials -->
  <path d="M15 45 C14 43 12 43 11 44" />
  <path d="M49 45 C50 43 52 43 53 44" />
  <!-- Lower eave -->
  <path d="M14 45 L20 37 H44 L50 45 Z" />

  <!-- Arched Royal Thai Sanctuary Portal -->
  <path d="M28 52 V44 C28 41 36 41 36 44 V52" />
  <line x1="32" y1="41" x2="32" y2="38" stroke-width="1.5" />

  <!-- Middle Roof Tier with Chofah Finials -->
  <path d="M19 37 C18 35 16 35 15 36" />
  <path d="M45 37 C46 35 48 35 49 36" />
  <path d="M18 37 L24 29 H40 L46 37 Z" />

  <!-- Upper Tier Roof -->
  <path d="M22 29 L27 22 H37 L42 29 Z" />

  <!-- Soaring Prang Spire (Thai Buddhist Stupa Peak) -->
  <path d="M28 22 L32 7 L36 22 Z" />
  <!-- Concentric decorative rings on spire -->
  <line x1="29" y1="18" x2="35" y2="18" stroke-width="1.5" />
  <line x1="30" y1="14" x2="34" y2="14" stroke-width="1.5" />
  <line x1="31" y1="10" x2="33" y2="10" stroke-width="1.5" />

  <!-- Golden Spire Apex Finial (Nopphasit) -->
  <circle cx="32" cy="5.5" r="1.5" fill="currentColor" />

  <!-- Decorative Thai Temple Windows -->
  <rect x="23" y="46" width="3" height="4" rx="0.5" />
  <rect x="38" y="46" width="3" height="4" rx="0.5" />
</svg>