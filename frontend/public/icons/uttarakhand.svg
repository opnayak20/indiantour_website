<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
  <!-- Ground foundation base line -->
  <line x1="6" y1="58" x2="58" y2="58" />
  <rect x="10" y="54" width="44" height="4" rx="0.5" />

  <!-- Kedarnath Himalayan Snow Mountain Peaks (Dramatic Background) -->
  <path d="M4 42 L16 16 L28 36 L40 12 L54 36 L60 46" />
  <path d="M12 24 L16 16 L20 23" stroke-width="1.5" />
  <path d="M36 20 L40 12 L44 19" stroke-width="1.5" />

  <!-- KEDARNATH TEMPLE (Devbhoomi Uttarakhand) -->
  <!-- Mandapa Assembly Hall (Front Pillared Hall, Right) -->
  <rect x="32" y="42" width="22" height="12" />
  <!-- Mandapa Sloping Stone Gabled Roof -->
  <path d="M30 42 L43 32 L56 42 Z" />
  <!-- Mandapa Arched Entry Portal -->
  <path d="M40 54 V46 C40 44 46 44 46 46 V54" />
  <!-- Pillars on Mandapa -->
  <line x1="34" y1="42" x2="34" y2="54" stroke-width="1.5" />
  <line x1="52" y1="42" x2="52" y2="54" stroke-width="1.5" />

  <!-- Garbhagriha Sanctum Base (Left) -->
  <rect x="14" y="42" width="18" height="12" />

  <!-- Magnificent Kedarnath Stone Shikhara (Curvilinear Spire) -->
  <path d="M14 42 C15 32 18 24 23 18 H23 C28 24 31 32 32 42" />
  <!-- Horizontal architectural stone carving tiers (Bhumis) -->
  <line x1="16" y1="36" x2="30" y2="36" stroke-width="1.5" />
  <line x1="18" y1="30" x2="28" y2="30" stroke-width="1.5" />
  <line x1="20" y1="24" x2="26" y2="24" stroke-width="1.5" />

  <!-- Amalaka (Ribbed stone disc at spire summit) -->
  <ellipse cx="23" cy="17" rx="3.5" ry="1.5" />
  <!-- Kalash (Sacred golden urn finial) -->
  <path d="M21.5 17 C21.5 14 24.5 14 24.5 17" />
  <line x1="23" y1="14" x2="23" y2="10" stroke-width="1.5" />

  <!-- Holy Lord Shiva Trishul (Trident) standing before temple -->
  <line x1="57" y1="58" x2="57" y2="30" stroke-width="2" />
  <!-- Trident Prongs -->
  <path d="M54 36 C54 33 57 32 57 32 C57 32 60 33 60 36" stroke-width="1.5" />
  <line x1="57" y1="32" x2="57" y2="28" stroke-width="2" />
  <!-- Damru accent on trident -->
  <path d="M55.5 38 L58.5 41 H55.5 L58.5 38 Z" fill="currentColor" stroke-width="1" />
</svg>
