<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
  <!-- Ground snow line -->
  <line x1="4" y1="58" x2="60" y2="58" />

  <!-- Towering Snow-Capped Himalayan Peaks (Background) -->
  <path d="M4 42 L18 16 L32 38 L44 18 L60 44" />
  <!-- Snow cap peaks line -->
  <path d="M14 24 L18 16 L22 23" stroke-width="1.5" />
  <path d="M40 25 L44 18 L48 24" stroke-width="1.5" />

  <!-- Mountain Sun rising behind ridge -->
  <circle cx="32" cy="14" r="5" stroke-dasharray="0" />
  <line x1="32" y1="6" x2="32" y2="4" stroke-width="1.5" />
  <line x1="25" y1="9" x2="23" y2="8" stroke-width="1.5" />
  <line x1="39" y1="9" x2="41" y2="8" stroke-width="1.5" />

  <!-- Dense Evergreen Deodar Pine Trees (Left) -->
  <!-- Pine tree 1 -->
  <path d="M12 36 L7 44 H17 Z" />
  <path d="M12 42 L6 50 H18 Z" />
  <path d="M12 48 L5 56 H19 Z" />
  <line x1="12" y1="56" x2="12" y2="58" stroke-width="2" />

  <!-- Traditional Himalayan Wooden Chalet / Cottage (Center Right) -->
  <!-- Stone foundation & wood walls -->
  <rect x="25" y="42" width="26" height="15" rx="0.5" />

  <!-- Sloping Alpine Snow Gabled Roof with Overhang -->
  <path d="M22 42 L38 27 L54 42 Z" />
  <!-- Thick snow layer line on roof -->
  <path d="M23 40 L38 29 L53 40" stroke-width="1.5" />

  <!-- Stone Chimney with Smoke Curl -->
  <path d="M45 34 V26 H49 V38" />
  <path d="M47 24 C45 22 49 20 47 17" stroke-width="1.5" />

  <!-- Wooden Front Door -->
  <rect x="34" y="47" width="8" height="10" rx="0.5" />
  <circle cx="40" cy="52" r="0.8" fill="currentColor" />

  <!-- Attic Dormer / Glass Window -->
  <rect x="27" y="46" width="5" height="5" rx="0.5" stroke-width="1.5" />
  <rect x="44" y="46" width="5" height="5" rx="0.5" stroke-width="1.5" />
  
  <!-- Right Pine Tree (Right edge) -->
  <path d="M56 42 L52 48 H60 Z" stroke-width="1.5" />
  <path d="M56 47 L51 54 H61 Z" stroke-width="1.5" />
  <line x1="56" y1="54" x2="56" y2="58" stroke-width="1.5" />
</svg>