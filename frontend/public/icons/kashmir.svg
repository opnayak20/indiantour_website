<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
  <!-- Dal Lake water surface with ripples -->
  <line x1="4" y1="58" x2="60" y2="58" />
  <path d="M10 55 C16 53 22 55 28 53" stroke-width="1.5" />
  <path d="M38 55 C44 53 50 55 56 53" stroke-width="1.5" />

  <!-- Snow-capped Pir Panjal Mountain Peaks (Background) -->
  <path d="M4 38 L14 22 L24 35 L34 18 L46 32 L58 16 L62 38" />
  <!-- Snow crests on mountain ridges -->
  <path d="M11 26 L14 22 L17 26" stroke-width="1.5" />
  <path d="M31 22 L34 18 L37 22" stroke-width="1.5" />
  <path d="M55 20 L58 16 L60 20" stroke-width="1.5" />

  <!-- Kashmiri Shikara Wooden Boat (Foreground) -->
  <!-- Long, curved elegant wooden boat hull with raised prow & stern -->
  <path d="M6 46 C14 53 46 54 58 44 L56 42 C44 50 16 49 8 42 Z" fill="currentColor" fill-opacity="0.1" />

  <!-- Pointed upward prow ornamental finial -->
  <circle cx="6" cy="44" r="1.5" fill="currentColor" />
  <circle cx="58" cy="42" r="1.5" fill="currentColor" />

  <!-- Canopy Pillars (Supporting the royal tent roof) -->
  <line x1="20" y1="46" x2="20" y2="33" />
  <line x1="40" y1="46" x2="40" y2="33" />

  <!-- Shikara Canopy Fabric Roof (Gabled Pagoda Canopy) -->
  <path d="M17 33 L30 25 L43 33 Z" />
  <!-- Scalloped / ruffled fabric valance curtain along edge -->
  <path d="M17 33 Q20 36 23 33 Q26 36 29 33 Q32 36 35 33 Q38 36 41 33 Q43 36 43 33" stroke-width="1.5" />

  <!-- Luxurious cushioned seating inside cabin -->
  <rect x="23" y="42" width="14" height="4" rx="1" stroke-width="1.5" />

  <!-- Traditional Kashmiri Heart-Shaped Wooden Oar resting along stern -->
  <line x1="42" y1="36" x2="52" y2="52" stroke-width="2" />
  <!-- Heart-shaped blade of the Kashmiri paddle -->
  <path d="M52 52 C54 50 56 52 54 55 C53 56.5 50.5 55 52 52 Z" fill="currentColor" fill-opacity="0.2" />

  <!-- Floating Dal Lake Lotus flower accent -->
  <path d="M14 55 C15 52 17 52 18 55" stroke-width="1.5" />
</svg>